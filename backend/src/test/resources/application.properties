quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:eos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.oidc.enabled=false
quarkus.oidc.devservices.enabled=false
eos.pass.signing-secret=test-only-pass-secret-at-least-32-characters
eos.visit-session.signing-secret=test-only-visit-session-secret-32-chars
