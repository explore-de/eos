## Visitor-pass QR signatures. Set this to a secret of at least 32 characters in
## every deployed environment; it deliberately has no insecure default.
# eos.pass.signing-secret=${EOS_PASS_SIGNING_SECRET}
eos.pass.verification-ttl=PT24H

## Visitor badge sessions. Same rule as the pass secret: at least 32 characters,
## no insecure default.
# eos.visit-session.signing-secret=${EOS_VISIT_SESSION_SIGNING_SECRET}
eos.visit-session.ttl=PT16H

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
