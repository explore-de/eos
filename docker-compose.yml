name: eos

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: eos
      POSTGRES_USER: eos
      POSTGRES_PASSWORD: ${EOS_DB_PASSWORD:-eos-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eos -d eos"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${EOS_DB_PORT:-5432}:5432"
    volumes:
      - eos-db:/var/lib/postgresql

  oidc:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${EOS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${EOS_KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "${EOS_OIDC_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/eos-realm.json:/opt/keycloak/data/import/eos-realm.json:ro

  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.compose
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/eos
      QUARKUS_DATASOURCE_USERNAME: eos
      QUARKUS_DATASOURCE_PASSWORD: ${EOS_DB_PASSWORD:-eos-local-only}
      QUARKUS_OIDC_AUTH_SERVER_URL: http://oidc:8080/realms/eos
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: protocol/openid-connect/certs
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:${EOS_OIDC_PORT:-8180}/realms/eos
      QUARKUS_OIDC_APPLICATION_TYPE: service
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      EOS_PASS_SIGNING_SECRET: ${EOS_PASS_SIGNING_SECRET:-local-development-only-pass-secret-change-me}
      EOS_VISIT_SESSION_SIGNING_SECRET: ${EOS_VISIT_SESSION_SIGNING_SECRET:-local-development-only-visit-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      oidc:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EOS_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${EOS_FRONTEND_PORT:-3000}:80"

volumes:
  eos-db:
